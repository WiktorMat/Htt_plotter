[metadata]
name = wham
version = 0.1.0
description = Fast H->tautau analysis plotter (validated YAML configs, skim + histogram caches, CMS-style plots)

[options]
package_dir =
    = source
packages = find:
python_requires = >=3.9
install_requires =
    numpy
    pandas
    pyarrow
    PyYAML
    matplotlib
    mplhep
    hist
    pydantic>=2
    click
    rich

[options.packages.find]
where = source

[options.entry_points]
console_scripts =
    wham = wham.cli:main
