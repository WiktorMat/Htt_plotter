# wham fit config — Z->tau_mu tau_h signal-strength (rate) fit on the visible mass
# Run with:  wham fit mvis_rate
#
# The same fit as the no-YAML shortcut `wham fit m_vis`, but explicit and
# editable. POI r scales DY_2Tau; the QCD normalization floats freely
# (rateParam) so the data decides it — relevant while the BDT-FF vs ABCD
# normalization question is open.

name: zll_mvis
analysis: mutau_2024
variable: m_vis
mode: rate
signal: DY_2Tau
bin: mt_SR

asimov:
  enabled: false           # fit the observed 2024 data; true -> Asimov (-t -1)

scan:
  points: 60
  range: [0.8, 1.2]        # r is measured at the percent level here

auto_mc_stats: 10

systematics:
  # lumi on simulated processes only — QCD is data-driven
  - {name: lumi_13p6TeV, effect: lnN, processes: [tt, dibosons, "W+jets", "DY_*"], scaleFactor: 1.025}
  - {name: xsec_tt,      effect: lnN, processes: [tt],         scaleFactor: 1.05}
  - {name: xsec_vv,      effect: lnN, processes: [dibosons],   scaleFactor: 1.06}
  - {name: xsec_w,       effect: lnN, processes: ["W+jets"],   scaleFactor: 1.05}
  # xsec_dy only on the mu->tau_h fake component; the signal rate is the POI
  - {name: xsec_dy,      effect: lnN, processes: [DY_2Mu],     scaleFactor: 1.02}
  # free-floating QCD normalization (one shared parameter)
  - {name: norm_qcd,     effect: rateParam, processes: [QCD],  range: [0.1, 5]}
