# WHAM Phi_CP Asimov fit template.
#
# This mirrors the TIDAL CP-datacard idea as closely as current WHAM fit YAML
# allows: one or more CP-sensitive categories, an unrolled Phi_CP observable,
# CP-even/CP-odd weighted signal templates, and an Asimov truth point.
#
# Current mutau_2024.yaml does not yet define Higgs signal processes such as
# ggH/qqH. Add them to the analysis YAML before running this template, or replace
# the model.processes keys below with the signal process names present there.
# See phi_cp_report.md for the non-1:1 differences vs TIDAL.

name: phi_cp_asimov
analysis: mutau_2024_CP

categories:
  # TIDAL mt CP categories mapped onto columns available in test_file.parquet.
  - name: mt_higgs_mupi
    variable: MVA_vs_aco_mu_pi
    cut: "BDT_pred_class == 1 & ip_LengthSig_1 > 1.0 & decayModePNet_2 == 0 & ip_LengthSig_2 >= 1.0"
  - name: mt_higgs_murho
    variable: MVA_vs_aco_mu_rho
    cut: "BDT_pred_class == 1 & ip_LengthSig_1 > 1.0 & decayMode_2 == 1 & decayModePNet_2 == 1 & pion_E_split_2 > 0.15"
  - name: mt_higgs_mua11pr
    variable: MVA_vs_aco_mu_rho
    cut: "BDT_pred_class == 1 & ip_LengthSig_1 > 1.0 & decayMode_2 == 1 & decayModePNet_2 == 2 & pion_E_split_2 > 0.15"
  - name: mt_higgs_mua1
    variable: MVA_vs_aco_mu_a1
    cut: "BDT_pred_class == 1 & ip_LengthSig_1 > 1.0 & decayModePNet_2 == 10 & hasRefitSV_2"

model:
  pois:
    alpha: {init: 0.0, range: [0.0, 1.0]}
  processes:
    # Add corresponding processes to mutau_2024.yaml, with samples matching the
    # Higgs inputs. The per-event CP weights must be present in the skims.
    ggH:
      components:
        even: {weight: wt_cp_sm, scale: "1 - alpha"}
        odd:  {weight: wt_cp_ps, scale: "alpha"}

systematics: []

scans:
  - {pois: [alpha], points: 80, range: [0.0, 1.0]}

asimov:
  enabled: true
  # SM Asimov truth. Here alpha is a linear template interpolation:
  # alpha=0 -> SM template, alpha=1 -> PS template.
  parameters: {alpha: 0.0}

toy: {asymmetry: 0.0}

auto_mc_stats: null

