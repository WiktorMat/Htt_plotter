# WHAM analysis config for tt-channel Phi_CP studies.
#
# This is a CP-oriented tautau config shaped after the TIDAL CP datacard
# categories and the columns available in the current stitched parquet files.
#
# Before running on the full sample area, check that the Higgs sample patterns
# below match real directories under data_dir and add their xs/eff values to
# params.yaml or sample_params.

name: tautau_2024_CP
lumi: 109080.0
data_dir: /eos/user/w/wmatyszk/ditau_analysis/Higgs_KinFit_full/Run3_2024/tt

style:
  cms_label: "Private Work"
  era: "2024"
  com: 13.6

selection: >
  pt_1 > 25 & pt_2 > 25
  & abs(eta_1) < 2.4 & abs(eta_2) < 2.5
  & ip_z_1 < 0.2 & ip_z_2 < 0.2
  & idDeepTau2018v2p5VSe_1 >= 2
  & idDeepTau2018v2p5VSe_2 >= 2
  & idDeepTau2018v2p5VSmu_1 >= 4
  & idDeepTau2018v2p5VSmu_2 >= 4

trigger: "trg_doubletau == 1 | trg_doubletau_deeptau == 1 | trg_doubletauandjet == 1 | trg_doubletauandjet_deeptau == 1"
weight: weight

processes:
  DY_2Tau:  {samples: ["DYto2Tau_*"], color: "tab:orange",
             label: "$Z\\rightarrow\\tau_{h}\\tau_{h}$"}

  # Signal process names used by Configurations/fits/phi_cp.yaml.
  # Adjust sample globs to the actual Higgs directories available in data_dir.
  ggH:      {samples: ["GluGluHTo2Tau*"], color: "tab:green",
             label: "ggH, H\\rightarrow\\tau\\tau"}

  data:     {kind: data, samples: ["FakeData"], color: "black"}

qcd:
  method: abcd
  os: "os == 1"
  iso: "idDeepTau2018v2p5VSjet_1 >= 7 & idDeepTau2018v2p5VSjet_2 >= 7"
  antiiso: "(idDeepTau2018v2p5VSjet_1 > 1 & idDeepTau2018v2p5VSjet_1 < 7) | (idDeepTau2018v2p5VSjet_2 > 1 & idDeepTau2018v2p5VSjet_2 < 7)"

variables:
  pt_1:    {bins: 24, range: [20, 80],  label: "$p_{T}^{\\tau_{h,1}}$ [GeV]"}
  pt_2:    {bins: 24, range: [20, 80],  label: "$p_{T}^{\\tau_{h}}$ [GeV]"}
  m_vis:   {bins: 40, range: [0, 200],  label: "$m_{vis}$ [GeV]"}
  m_vis_varbins: {column: m_vis, bins: [0, 40, 55, 65, 75, 85, 95, 110, 130, 160, 200],
                  label: "$m_{vis}$ [GeV]"}
  mt_1:    {bins: 40, range: [0, 200],  label: "$m_{T}(\\mu)$ [GeV]"}
  met_pt:  {bins: 40, range: [0, 200],  label: "$p_{T}^{miss}$ [GeV]"}
  dR:      {bins: 50, range: [0, 5],    label: "$\\Delta R(\\mu, \\tau_{h})$"}

  bdt_cp: {column: BDT_pred_score, bins: [0.33, 0.57, 0.68, 0.77, 0.85, 1.0],
           label: "BDT score"}
  aco_pi_pi:  {bins: 8,  range: [0, 6.283185307179586], label: "$\\phi_{CP}(\\pi\\pi)$", kind: angle}
  aco_pi_rho: {bins: 8, range: [0, 6.283185307179586], label: "$\\phi_{CP}(\\pi\\rho)$", kind: angle}
  aco_rho_pi: {bins: 8, range: [0, 6.283185307179586], label: "$\\phi_{CP}(\\rho\\pi)$", kind: angle}
  aco_rho_rho: {bins: 8, range: [0, 6.283185307179586], label: "$\\phi_{CP}(\\rho\\rho)$", kind: angle}
  aco_pi_a1: {column: aco_pi_a1_FASTMTT_MassConstraint, bins: 8,
              range: [0, 6.283185307179586], label: "$\\phi_{CP}(\\pi a_{1})$", kind: angle}
  aco_rho_a1: {column: aco_rho_a1_FASTMTT_MassConstraint, bins: 8,
               range: [0, 6.283185307179586], label: "$\\phi_{CP}(\\rho a_{1})$", kind: angle}
  aco_a1_pi: {column: aco_a1_pi_FASTMTT_MassConstraint, bins: 8,
              range: [0, 6.283185307179586], label: "$\\phi_{CP}(a_{1}\\pi)$", kind: angle}
  aco_a1_rho: {column: aco_a1_rho_FASTMTT_MassConstraint, bins: 8,
               range: [0, 6.283185307179586], label: "$\\phi_{CP}(a_{1}\\rho)$", kind: angle}
  aco_a1_a1: {bins: 8, range: [0, 6.283185307179586], label: "$\\phi_{CP}(a_{1}a_{1})$", kind: angle}

  MVA_vs_aco_pi_pi:  {unroll: [aco_pi_pi, bdt_cp],  label: "BDT score x $\\phi_{CP}(\\pi\\pi)$"}
  MVA_vs_aco_pi_rho: {unroll: [aco_pi_rho, bdt_cp], label: "BDT score x $\\phi_{CP}(\\pi\\rho)$"}
  MVA_vs_aco_rho_pi: {unroll: [aco_rho_pi, bdt_cp], label: "BDT score x $\\phi_{CP}(\\rho\\pi)$"}
  MVA_vs_aco_rho_rho: {unroll: [aco_rho_rho, bdt_cp], label: "BDT score x $\\phi_{CP}(\\rho\\rho)$"}
  MVA_vs_aco_pi_a1:  {unroll: [aco_pi_a1, bdt_cp],  label: "BDT score x $\\phi_{CP}(\\pi a_{1})$"}
  MVA_vs_aco_rho_a1: {unroll: [aco_rho_a1, bdt_cp], label: "BDT score x $\\phi_{CP}(\\rho a_{1})$"}
  MVA_vs_aco_a1_pi:  {unroll: [aco_a1_pi, bdt_cp],  label: "BDT score x $\\phi_{CP}(a_{1}\\pi)$"}
  MVA_vs_aco_a1_rho: {unroll: [aco_a1_rho, bdt_cp], label: "BDT score x $\\phi_{CP}(a_{1}\\rho)$"}
  MVA_vs_aco_a1_a1:  {unroll: [aco_a1_a1, bdt_cp],  label: "BDT score x $\\phi_{CP}(a_{1}a_{1})$"}

plots:
  datamc:
    - bdt_cp
    - MVA_vs_aco_pi_pi
    - MVA_vs_aco_pi_rho
    - MVA_vs_aco_rho_pi
    - MVA_vs_aco_rho_rho
    - MVA_vs_aco_pi_a1
    - MVA_vs_aco_rho_a1
    - MVA_vs_aco_a1_pi
    - MVA_vs_aco_a1_rho
    - MVA_vs_aco_a1_a1
    - pt_1
    - pt_2
    - m_vis
    - mt_1
    - met_pt
    - dR
  cp:
    - {var: aco_pi_pi,   even: wt_cp_sm, odd: wt_cp_ps}
    - {var: aco_pi_rho,  even: wt_cp_sm, odd: wt_cp_ps}
    - {var: aco_rho_pi,  even: wt_cp_sm, odd: wt_cp_ps}
    - {var: aco_rho_rho, even: wt_cp_sm, odd: wt_cp_ps}
    - {var: aco_pi_a1,   even: wt_cp_sm, odd: wt_cp_ps}
    - {var: aco_rho_a1,  even: wt_cp_sm, odd: wt_cp_ps}
    - {var: aco_a1_pi,   even: wt_cp_sm, odd: wt_cp_ps}
    - {var: aco_a1_rho,  even: wt_cp_sm, odd: wt_cp_ps}
    - {var: aco_a1_a1,   even: wt_cp_sm, odd: wt_cp_ps}
